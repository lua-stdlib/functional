      f({1, 2, 3}, function(e) n = n + 1 return e end)
      expect(n).to_be(1)
  - it takes the predicate before the function:
      expect(f({1, 2, 3}, function(r) return r > 4 end, M.lambda '=_1 * 2')).
         to_be(6)
  - it compares results with any other value:
      expect(f({1, 2, 3}, 4, M.lambda '=_1 * 2')).to_be(4)
  - it passes all the results of the call to the predicate:
