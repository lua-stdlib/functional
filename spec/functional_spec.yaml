      n, u = memfn(1, nil, nil)
      expect(t).not_to_be(u)
  - it accepts alternative mnemonic function:
      mnemonic = function(...) return select('#', ...) end
      memfn = f(function(x) return {x} end, mnemonic)
      expect(memfn 'same').to_be(memfn 'not same')
      expect(memfn(1, 2)).to_be(memfn(false, 'x'))
      expect(memfn 'one').not_to_be(memfn('one', 'two'))


- describe nop:
  - before:
      f = M.nop
  - it accepts any number of arguments:
      expect(f()).to_be(nil)
      expect(f(false)).to_be(nil)
      expect(f(1, 2, 3, nil, 'str', {}, f)).to_be(nil)
  - it returns no values:
      expect(f(1, 'two', false)).to_be(nil)


- describe partition:
  - before:
      even = function(e) return e % 2 == 0 end

      f = M.partition

  - context with bad arguments:
      badargs.diagnose('std.functional.partition(table|function, ?any)', f)

  - it works with an empty table:
      pass, fail = f({}, even)
      expect(pass).to_equal {n=0}
      expect(fail).to_equal {n=0}
  - it splits the items by a predicate function:
      pass, fail = f({1, 2, 3, 4, 5}, even)
      expect(pass).to_equal {n=2, 2, 4}
      expect(fail).to_equal {n=3, 1, 3, 5}
  - it compares items with any other value:
      pass, fail = f({1, 2, 1}, 1)
      expect(pass).to_equal {n=2, 1, 1}
      expect(fail).to_equal {n=1, 2}
  - it keeps holes in the items:
      pass, fail = f(pack('a', nil, 'c'), function(e) return e ~= nil end)
      expect(pass).to_equal {n=2, 'a', 'c'}
      expect(fail).to_equal {n=1}
  - it splits the results of an iterator function:
      pass, fail = f(('a b c'):gmatch '%a', function(e) return e == 'b' end)
      expect(pass).to_equal {n=1, 'b'}
      expect(fail).to_equal {n=2, 'a', 'c'}
  - it passes all iteration results to the predicate:
      pass, fail = f(M.iter(ipairs {'a', 'b', 'c'}), function(i, e) return e == 'b' end)
      expect(pass).to_equal {n=1, 2}
      expect(fail).to_equal {n=2, 1, 3}


- describe pluck:
  - before:
      f = M.pluck

  - context with bad arguments:
      badargs.diagnose('std.functional.pluck(table, table|function)', f)

  - it works with an empty table:
      expect(f({}, {'a'})).to_equal {}
  - it copies just the entries for the keys:
      expect(f({a=1, b=2, c=3}, {'a', 'c'})).to_equal {a=1, c=3}
  - it leaves out keys that are not in the table:
      expect(f({a=1}, {'a', 'z'})).to_equal {a=1}
  - it returns an empty table if there are none:
      expect(f({a=1}, {'z'})).to_equal {}
  - it keeps false values:
      expect(f({a=false}, {'a'})).to_equal {a=false}
  - it ignores holes in the keys:
      expect(f({a=1}, pack('a', nil))).to_equal {a=1}
  - it takes the keys from an iterator function:
      expect(f({a=1, b=2, c=3}, ('a c'):gmatch '%a')).to_equal {a=1, c=3}
  - it does not perturb the argument table:
      t = {a=1}
      f(t, {'a'})
      expect(t).to_equal {a=1}


- describe predicate:
  - before:
      f = M.predicate

  - context with bad arguments:
      badargs.diagnose('std.functional.predicate(?any)', f)

  - it returns a plain function as is:
      expect(f(M.id)).to_be(M.id)
  - it unwraps a lambda to the plain function inside it:
      l = M.lambda '|e| e % 2 == 0'
      fn = f(l)
      expect(type(fn)).to_be 'function'
      expect(fn(4)).to_be(true)
      expect(fn(5)).to_be(false)
      expect(f(l)).to_be(fn)
  - it wraps any other functable in a plain function that calls it:
      functable = setmetatable({}, {__call = function(_, ...) return ... end})
      fn = f(functable)
      expect(type(fn)).to_be 'function'
      expect({fn(1, nil, 3)}).to_equal {1, nil, 3}
  - it makes a test for equality with any other value:
      for _, v in ipairs {true, false, 42, 'str', {}} do
         expect(f(v)(v)).to_be(true)
         expect(f(v)(0 == v and 1 or 0)).to_be(false)
      end
  - it tests for nil without arguments:
      expect(f(nil)(nil)).to_be(true)
      expect(f(nil)(false)).to_be(false)
  - it does not look inside tables:
      expect(f({1})({1})).to_be(false)
  - it honours __eq:
      mt = {__eq = function() return true end}
      expect(f(setmetatable({}, mt))(setmetatable({}, mt))).to_be(true)


- describe product:
  - before:
      f = M.product

  - context with bad arguments:
      badargs.diagnose('std.functional.product(list...)', f)

  - it works with an empty table:
      expect(f {}).to_equal {n=0}
  - it returns a list of elements from a single argument:
      expect(f {'a', 'b', 'c'}).to_equal {n=3, {'a'}, {'b'}, {'c'}}
  - it lists combinations with one element from each argument:
      expect(f({1, 2, 3}, {4, 5, 6})).to_equal {
         n=9,
         {1, 4}, {1, 5}, {1, 6},
         {2, 4}, {2, 5}, {2, 6},
         {3, 4}, {3, 5}, {3, 6},
      }
      expect(f({1, 2}, {3, 4}, {5, 6})).to_equal {
         n=8,
         {1, 3, 5}, {1, 3, 6},   {1, 4, 5}, {1, 4, 6},
         {2, 3, 5}, {2, 3, 6},   {2, 4, 5}, {2, 4, 6},
      }
      expect(M.map(f({0,1},{0,1},{0,1}), table.concat)).
         to_equal {n=8, '000', '001', '010', '011', '100', '101', '110', '111'}


- describe reject:
  - before:
      even = function(e) return e % 2 == 0 end

      f = M.reject

  - context with bad arguments:
      badargs.diagnose('std.functional.reject(table|function, ?any)', f)

  - it works with an empty table:
      expect(f({}, even)).to_equal {n=0}
  - it keeps the items that fail a predicate function:
      expect(f({1, 2, 3, 4, 5}, even)).to_equal {n=3, 1, 3, 5}
  - it rejects the items equal to any other value:
      expect(f({1, 2, 1, 3}, 1)).to_equal {n=2, 2, 3}
  - it treats a functable as a value:
      functable = setmetatable({}, {__call = M.nop})
      expect(f({functable, 1}, functable)).to_equal {n=1, 1}
      expect(f({1}, M.lambda '=true')).to_equal {n=1, 1}
  - it keeps holes in the items:
      expect(f(pack('a', nil, 'c'), 'a')).to_equal {n=2, [2]='c'}
  - it rejects from the results of an iterator function:
      expect(f(('a b c'):gmatch '%a', 'b')).to_equal {n=2, 'a', 'c'}


- describe shape:
  - before:
      l = {1, 2, 3, 4, 5, 6}

      f = M.shape

  - context with bad arguments:
      badargs.diagnose('std.functional.shape(table, table)', f)

  - it returns a table:
      expect(objtype(f(l, {2, 3}))).to_be 'table'
  - it works for an empty table:
      expect(f({}, {0})).to_equal({})
  - it returns the result in a new table:
      expect(f(l, {2, 3})).not_to_be(l)
  - it does not perturb the argument table:
      f(l, {2, 3})
      expect(l).to_equal {1, 2, 3, 4, 5, 6}
  - it reshapes a table according to given dimensions:
      expect(f(l, {2, 3})).
         to_equal({{1, 2, 3}, {4, 5, 6}})
      expect(f(l, {3, 2})).
         to_equal({{1, 2}, {3, 4}, {5, 6}})
  - it treats 0-valued dimensions as an indefinite number:
      expect(f(l, {2, 0})).
         to_equal({{1, 2, 3}, {4, 5, 6}})
      expect(f(l, {0, 2})).
         to_equal({{1, 2}, {3, 4}, {5, 6}})


- describe some:
  - before:
      f = M.some

  - context with bad arguments:
      badargs.diagnose('std.functional.some(table|function, [?any])', f)

  - it works with an empty table:
      expect(f {}).to_be(false)
  - it defaults to any truthy item:
      expect(f {false, 'x'}).to_be(true)
      expect(f {false, false}).to_be(false)
  - it compares items with an explicit nil:
      expect(f({false, 0}, nil)).to_be(false)
      expect(f(pack('a', nil), nil)).to_be(true)
  - it ignores holes by default:
      expect(f(pack(nil, nil))).to_be(false)
  - it uses a plain function as a predicate:
      expect(f({1, 2, 3}, function(e) return e > 2 end)).to_be(true)
      expect(f({1, 2, 3}, function(e) return e > 3 end)).to_be(false)
  - it compares items with any other value:
      expect(f({1, 2, 3}, 2)).to_be(true)
      expect(f({1, 2, 3}, 4)).to_be(false)
  - it tests the results of an iterator function:
      expect(f(('a b'):gmatch '%a', 'b')).to_be(true)
  - it stops at the first item that passes:
      n = 0
      f({1, 2, 3}, function(e) n = n + 1 return e == 1 end)
      expect(n).to_be(1)


- describe tabulate:
  - before:
      f = M.tabulate

  - context with bad arguments:
      badargs.diagnose('std.functional.tabulate(table|function, callable)', f)
  - it accepts a lambda:
      expect(f({'a', 'b'}, M.lambda '=_1, _1 .. "x"')).
         to_equal {a='ax', b='bx'}

  - it works with an empty table:
      expect(f({}, M.id)).to_equal {}
  - it makes a table from the keys and values returned:
      expect(f({'a', 'b'}, function(e) return e, e .. 'x' end)).
         to_equal {a='ax', b='bx'}
  - it inverts a table with iter:
      expect(f(M.iter(pairs {'x', 'y'}), function(k, v) return v, k end)).
         to_equal {x=1, y=2}
  - it leaves out items with a nil key:
      expect(f({1, 2, 3}, function(e) if e ~= 2 then return e, true end end)).
         to_equal {[1]=true, [3]=true}
  - it stores false values:
      expect(f({1}, function(e) return e, false end)).to_equal {[1]=false}
  - it lets a later key replace an earlier one:
      expect(f({1, 2}, function(e) return 'k', e end)).to_equal {k=2}
  - it tabulates the results of an iterator function:
      expect(f(('a b'):gmatch '%a', function(e) return e, true end)).
         to_equal {a=true, b=true}
  - it passes all iteration results to the function:
      expect(f(M.iter(ipairs {'a', 'b'}), M.id)).to_equal {'a', 'b'}


- describe sorted:
  - before:
      f = M.sorted

  - context with bad arguments:
      badargs.diagnose('std.functional.sorted(table|function, [?callable])', f)
  - it accepts a lambda comparison:
      expect(f({1, 3, 2}, M.lambda '=_1 > _2')).to_equal {n=3, 3, 2, 1}

  - it works with an empty table:
      expect(f {}).to_equal {n=0}
  - it sorts by < by default:
      expect(f {3, 1, 2}).to_equal {n=3, 1, 2, 3}
      expect(f {'b', 'c', 'a'}).to_equal {n=3, 'a', 'b', 'c'}
  - it sorts with a comparison function:
      expect(f({1, 3, 2}, function(a, b) return a > b end)).to_equal {n=3, 3, 2, 1}
  - it keeps the order of items that compare the same:
      items = {{k=1, v='a'}, {k=0, v='b'}, {k=1, v='c'}, {k=0, v='d'}, {k=1, v='e'}}
      r = f(items, function(a, b) return a.k < b.k end)
      expect(M.map(r, function(e) return e.v end)).to_equal {n=5, 'b', 'd', 'a', 'c', 'e'}
  - it keeps the order of a long run of equal items:
      items = {}
      for i = 1, 200 do items[i] = {k = i % 3, i = i} end
      r = f(items, function(a, b) return a.k < b.k end)
      for i = 2, 200 do
         if r[i - 1].k == r[i].k and r[i - 1].i > r[i].i then
            error 'not stable'
         end
      end
  - it returns a new list, leaving the argument alone:
      t = {3, 1, 2}
      expect(f(t)).not_to_be(t)
      expect(t).to_equal {3, 1, 2}
  - it sorts the items of an iterator function:
      expect(f(('c a b'):gmatch '%a')).to_equal {n=3, 'a', 'b', 'c'}


- describe values:
  - before:
      f = M.values

  - context with bad arguments:
      badargs.diagnose('std.functional.values(table)', f)

  - it works with an empty table:
      expect(f {}).to_equal {n=0}
  - it lists the values, with n:
      r = f {a=1, b=2, c=3}
      expect(r.n).to_be(3)
      expect({r[1], r[2], r[3]}).to_contain.a_permutation_of {1, 2, 3}
  - it lists every value, including false:
      expect(f {a=false}).to_equal {n=1, false}
  - it returns a new table:
      t = {1}
      expect(f(t)).not_to_be(t)


- describe zip:
  - before:
      tt = {{1, 2}, {3, 4}, {5, 6}}

      f = M.zip

  - context with bad arguments:
      badargs.diagnose('std.functional.zip(table of tables)', f)

  - it works for an empty table:
      expect(f {}).to_equal {}
  - it is the inverse of itself:
      expect(f(f(tt))).to_equal(tt)
  - it transposes rows and columns:
      expect(f(tt)).to_equal {{1, 3, 5}, {2, 4, 6}}
      expect(f {x={a=1, b=2}, y={a=3, b=4}, z={b=5}}).
         to_equal {a={x=1, y=3}, b={x=2,y=4,z=5}}


- describe zip_with:
  - before:
      tt = {{1, 2}, {3, 4}, {5}}
      fn = function(...) return tonumber(table.concat {...}) end

      f = M.zip_with

  - context with bad arguments:
      badargs.diagnose('std.functional.zip_with(table of tables, callable)', f)
  - it accepts a lambda:
      expect(f({{1, 2}, {3, 4}}, M.lambda '=_1 + _2')).to_equal {4, 6}

  - it works for an empty table:
      expect(f({}, fn)).to_equal {}
  - it returns a table:
      expect(type(f(tt, fn))).to_be 'table'
  - it returns the result in a new table:
      expect(f(tt, fn)).not_to_be(tt)
  - it does not perturb the argument list:
      m = f(tt, fn)
      expect(tt).to_equal {{1, 2}, {3, 4}, {5}}
  - it combines column entries with a function:
      expect(f(tt, fn)).to_equal {135, 24}
  - it discards hash-part arguments:
      expect(f({{1,2}, x={3,4}, {[2]=5}}, fn)).to_equal {1, 25}
  - it combines matching key entries with a function:
      expect(f({{a=1,b=2}, {a=3,b=4}, {b=5}}, fn)).
         to_equal {a=13, b=245}
