# Functional programming for Lua 5.1, 5.2, 5.3, 5.4 & 5.5
# Copyright (C) 2014-2026 std.functional authors

before:
   this_module = 'std.functional.init'
   global_table = '_G'

   exported_apis = {
      'any', 'bind', 'callable', 'case', 'collect', 'compose', 'cond',
      'contains', 'converge', 'curry', 'default', 'detect', 'each', 'either', 'except',
      'filter', 'firstof', 'flatmap', 'flatten', 'foldl', 'foldr',
      'id', 'indexof', 'invert', 'ireverse', 'isempty', 'iter', 'lambda',
      'map', 'map_with', 'mapkeys', 'mapvalues', 'memoize', 'nop',
      'partition', 'pluck', 'predicate', 'product', 'reject', 'shape', 'some',
      'sorted', 'tabulate', 'values', 'zip', 'zip_with',
   }

   M = require(this_module)


specify functional:
- context when required:
  - context by name:
    - it does not touch the global table:
        expect(show_apis {added_to=global_table, by=this_module}).
           to_equal {}
  - it exports the documented apis:
      t = {}
      for k in pairs(M) do t[#t + 1] = k end
      expect(t).to_contain.a_permutation_of(exported_apis)


- describe any:
  - before:
      stop = function() return true end
      fail = function() return false end

      f = M.any

  - context with bad arguments:
      badargs.diagnose('std.functional.any(callable...)', f)
  - it accepts lambdas:
      expect(f(M.lambda '=nil', M.lambda '=_1')(5)).to_be(5)

  - it returns a single function:
      expect(type(f(M.id))).to_be 'function'
  - it propagates arguments and returned results:
      expect(f(M.id)(true)).to_be(true)
      expect({f(M.id)(1, 2, 3)}).to_equal {1, 2, 3}
  - it propagates nil arguments correctly:
      expect(pack(f(M.id)(nil, false, nil, 3))).
         to_equal {n=4, [2]=false, [4]=3}
  - it calls all functions until one returns non-nil:
      expect(f(M.id, M.id, stop, fail)(nil)).to_be(true)
  - it only looks at first returned value:
      expect(f(M.id, M.id, stop, fail)(nil, 'ignored')).to_be(true)
  - it does not call remaining functions after non-nil return:
      expect(f(M.id, fail)(true)).to_be(true)


- describe bind:
  - before:
      op = require 'std.functional.operator'

      f = M.bind

  - context with bad arguments:
      badargs.diagnose('std.functional.bind(callable, table)', f)
  - it accepts a lambda:
      expect(f(M.lambda '=_1 - _2', {10})(3)).to_be(7)

  - it does not affect normal operation if no arguments are bound:
      expect(f(math.min, {})(2, 3, 4)).to_be(2)
  - it takes the extra arguments into account:
      expect(f(math.min, {1, 0})(2, 3, 4)).to_be(0)
  - it appends final call arguments:
      expect(f(math.max, {2, 3})(4, 5, 1)).to_be(5)
  - it does not require all arguments in final call:
      div = function(a, b) return a / b end
      expect(f(div, {100})(25)).to_be(4)
  - it supports out of order extra arguments:
      expect(f(op.pow, {[2] = 3})(2)).to_be(8)
  - it propagates nil arguments correctly:
      r = pack(f(M.id, {[4]='d'})(1))
      expect(r).to_equal(pack(1, nil, nil, 'd'))
      r = pack(f(M.id, {[4]='d'})(nil, 2))
      expect(r).to_equal(pack(nil, 2, nil, 'd'))
      r = pack(f(M.id, {[2]='b', [4]='d'})(nil, 3, 5, 6, nil))
      expect(r).to_equal(pack(nil, 'b', 3, 'd', 5, 6, nil))
      r = pack(f(M.id, {[2]='b', [4]='d'})(nil, 3, nil, nil, 7))
      expect(r).to_equal(pack(nil, 'b', 3, 'd', nil, nil, 7))
      r = pack(f(M.id, {[2]='b', [4]='d'})(nil, 3, nil, nil, 7, nil, nil))
      expect(r).to_equal(pack(nil, 'b', 3, 'd', nil, nil, 7, nil, nil))


- describe callable:
  - before:
      f = M.callable

  - context with bad arguments:
      badargs.diagnose('std.functional.callable([?any])', f)

  - it returns the function associated with a callable:
      for _, v in ipairs {
         true,
         42,
         'str',
         io.stderr,
         {},
         M.nop,
         setmetatable({}, {__call = M.nop}),
      } do
         expect(f(v)).to_be(pcall(v, {}) and M.nop or nil)
      end
  - it returns 'nil' for uncallable arguments:
      expect(f()).to_be(nil)
      expect(f {}).to_be(nil)
      expect(f '').to_be(nil)


- describe case:
  - before:
      yes      = function() return true end
      no       = function() return false end
      default  = function(s) return s end
      branches = {yes=yes, no=no, default=default}

      f = M.case

  - context with bad arguments: |
      badargs.diagnose('std.functional.case(?any, table)', f)

  - it matches against branch keys:
      expect(f('yes', branches)).to_be(true)
      expect(f('no',   branches)).to_be(false)
  - it has a default for unmatched keys:
      expect(f('none', branches)).to_be 'none'
  - it returns nil for unmatched keys with no default:
      expect(f('none', {yes=yes, no=no})).to_be(nil)
  - it returns nil for no branches:
      expect(f('x', {})).to_be(nil)
  - it returns non-function matches:
      expect(f('t', {t=true})).to_be(true)
  - it matches a false branch:
      expect(f('f', {f=false, default='other'})).to_be(false)
  - it matches keys that are not strings:
      expect(f(5, {[5]='five'})).to_be 'five'
      expect(f(true, {[true]='yes'})).to_be 'yes'
  - it matches nil to the default:
      expect(f(nil, {default='dflt'})).to_be 'dflt'
  - it evaluates returned functions:
      expect(f('fn', {fn = function() return true end})).
         to_be(true)
  - it passes 'with' to function matches:
      expect(f('with', {with = function(s) return s .. '!' end})).
         to_be 'with!'
  - it passes 'with' to a function default:
      expect(f('with', {default = function(s) return s end})).to_be 'with'
  - it evaluates returned functables:
      functable = setmetatable({}, {__call = function(t, with) return with end})
      expect(f('functable', {functable=functable})).to_be 'functable'
  - it evaluates lambda matches:
      branches = {x=M.lambda '=_1 .. "!"', default=M.lambda '=_1 .. "?"'}
      expect(f('x', branches)).to_be 'x!'
      expect(f('y', branches)).to_be 'y?'
  - it evaluates 'with' exactly once:
      s = 'prince'
      function acc() s = s .. 's'; return s end
      expect(f(acc(), {
         prince   = function() return 'one' end,
         princes  = function() return 'many' end,
         princess = function() return 'one' end,
         default  = function() return 'gibberish' end,
      })).to_be 'many'
  - context with patterns:
    - before:
        branches = {
           {'%d+', 'number'},
           {'(%a+)=(%a+)', function(k, v) return k .. ':' .. v end},
           {'%a+', function(...) return select('#', ...) .. ':' .. ... end},
           exact = 'exact',
           default = 'none',
        }
    - it matches a string against patterns:
        expect(f('42', branches)).to_be 'number'
    - it passes the captures to a function branch:
        expect(f('a=b', branches)).to_be 'a:b'
    - it passes the whole match if there are no captures:
        expect(f('abc', branches)).to_be '1:abc'
    - it anchors patterns at both ends:
        expect(f('x42', branches)).to_be 'none'
        expect(f('42x', branches)).to_be 'none'
        expect(f('', branches)).to_be 'none'
    - it tries patterns in order:
        expect(f('a=b', {{'%a=%a', 'first'}, {'%a+=%a+', 'second'}})).
           to_be 'first'
        expect(f('a=b', {{'%a+=%a+', 'second'}, {'%a=%a', 'first'}})).
           to_be 'second'
    - it prefers an exact key to a pattern:
        expect(f('exact', branches)).to_be 'exact'
        expect(f('exact', {{'%a+', 'pattern'}, exact = 'exact'})).
           to_be 'exact'
    - it matches a false branch:
        expect(f('x', {{'x', false}, default = 'dflt'})).to_be(false)
    - it only matches strings against patterns:
        expect(f(42, {{'%d+', 'number'}, default = 'dflt'})).to_be 'dflt'
        expect(f(nil, {{'.*', 'any'}, default = 'dflt'})).to_be 'dflt'
        expect(f({}, {{'.*', 'any'}, default = 'dflt'})).to_be 'dflt'
    - it ignores array entries that are not pattern pairs:
        expect(f('x', {'one', {}, {5}, default = 'dflt'})).to_be 'dflt'
    - it falls through to the default:
        expect(f('1 2', branches)).to_be 'none'


- describe collect:
  - before:
      f = M.collect

  - context with bad arguments:
      badargs.diagnose('std.functional.collect(table|function)', f)

  - it works with an empty table:
      expect(f {}).to_equal {n=0}
  - it collects the values of a table:
      expect(f {'a', 'b', 'c'}).to_equal {n=3, 'a', 'b', 'c'}
  - it ignores keys outside the sequence:
      expect(f {1, 2, [5]=5, a='b', c='d'}).to_equal {n=2, 1, 2}
  - it takes the length from the n field:
      expect(f {n=3, 'a'}).to_equal {n=3, 'a'}
  - it keeps holes:
      expect(f(pack('a', nil, nil, 'd', 'e'))).
         to_equal {n=5, 'a', [4]='d', [5]='e'}
  - it collects the results of an iterator function:
      expect(f(('a b c'):gmatch '%a')).to_equal {n=3, 'a', 'b', 'c'}
  - it takes the first result of each iteration:
      expect(f(M.iter(ipairs {'x', 'y'}))).to_equal {n=2, 1, 2}
  - it stops at the first nil result:
      expect(f(M.iter(function(_, i)
         if i ~= 3 then return i + 1 end
      end, nil, 0))).to_equal {n=3, 1, 2, 3}


- describe compose:
  - before:
      f = M.compose

  - context with bad arguments:
      badargs.diagnose('std.functional.compose(callable...)', f)
  - it accepts lambdas:
      expect(f(M.lambda '=_1 + 1', M.lambda '=_1 * 2')(3)).to_be(8)

  - it composes a single function correctly:
      expect(f(M.id)(1)).to_be(1)
  - it propagates nil arguments correctly:
      expect(pack(f(M.id)(nil, 2, nil, nil))).
         to_equal(pack(nil, 2, nil, nil))
      expect(pack(f(M.id, M.id)(nil, 2, nil, nil))).
         to_equal(pack(nil, 2, nil, nil))
  - it composes functions in the correct order:
      expect(f(math.sin, math.cos)(1)).
         to_be(math.cos(math.sin(1)))


- describe cond:
  - before:
      f = M.cond

  - context with bad arguments:
      badargs.diagnose('std.functional.cond([table...])', f)

  - it returns nil for no arguments:
      expect(f()).to_be(nil)
  - it returns the branch of a clause whose test is truthy:
      expect(f {true, 'foo'}).to_be 'foo'
      expect(f {0, 'zero'}).to_be 'zero'
      expect(f {'', 'empty'}).to_be 'empty'
  - it evaluates a branch function with the test:
      expect(f {'truthy', function(s) return s .. '!' end}).to_be 'truthy!'
  - it evaluates a branch functable with the test:
      functable = setmetatable({}, {__call = function(_, s) return s end})
      expect(f {'truthy', functable}).to_be 'truthy'
  - it evaluates lambda branches:
      expect(f {'truthy', M.lambda '=_1 .. "!"'}).to_be 'truthy!'
  - it returns nil if no test is truthy:
      expect(f({nil, 'a'}, {false, 'b'})).to_be(nil)
      expect(f {false, true}).to_be(nil)
  - it treats a nil test as falsey:
      expect(f({nil, 'a'}, {true, 'b'})).to_be 'b'
  - it tries the clauses in order:
      expect(f({false, 1}, {true, 2}, {true, 3})).to_be(2)
  - it does not evaluate branches of clauses that fail:
      expect(f({false, error}, {true, 'ok'})).to_be 'ok'
  - it does not look at clauses after one that passes:
      unread = setmetatable({}, {__index = function() error 'read' end})
      expect(f({true, 1}, unread)).to_be(1)
  - it returns false and nil branches:
      expect(f {true, false}).to_be(false)
      expect(f({true}, {true, 'later'})).to_be(nil)
  - it can be written as an if chain:
      n = 5
      expect(f({n < 0, 'negative'}, {n == 0, 'zero'}, {true, 'positive'})).
         to_be 'positive'


- describe contains:
  - before:
      functable = setmetatable({}, {__call = M.nop})

      f = M.contains

  - context with bad arguments:
      badargs.diagnose('std.functional.contains(table|function, ?any)', f)

  - it works with an empty table:
      expect(f({}, 1)).to_be(false)
  - it finds a value among the items:
      expect(f({'a', 'b', 'c'}, 'b')).to_be(true)
      expect(f({'a', 'b', 'c'}, 'd')).to_be(false)
  - it finds false:
      expect(f({1, false}, false)).to_be(true)
  - it does not look inside tables:
      expect(f({{1}}, {1})).to_be(false)
  - it asks whether there is a hole with nil:
      expect(f(pack(1, nil, 3), nil)).to_be(true)
      expect(f({1, 2}, nil)).to_be(false)
  - it uses a plain function as a predicate:
      expect(f({1, 2, 3}, function(e) return e > 2 end)).to_be(true)
      expect(f({1, 2, 3}, function(e) return e > 3 end)).to_be(false)
  - it treats a functable as a value:
      expect(f({functable}, functable)).to_be(true)
      expect(f({1, 2}, M.lambda '=true')).to_be(false)
  - it calls a functable wrapped by predicate:
      expect(f({1, 2}, M.predicate(M.lambda '=_1 == 2'))).to_be(true)
  - it searches the results of an iterator function:
      expect(f(('a b c'):gmatch '%a', 'c')).to_be(true)
      expect(f(('a b c'):gmatch '%a', 'd')).to_be(false)
  - it stops at the first match:
      n = 0
      f({1, 2, 3}, function(e) n = n + 1 return e == 2 end)
      expect(n).to_be(2)


- describe curry:
  - before:
      op = require 'std.functional.operator'

      f = M.curry

  - context with bad arguments:
      badargs.diagnose('std.functional.curry(callable, int)', f)
  - it accepts a lambda:
      expect(f(M.lambda '=_1 - _2', 2)(10)(3)).to_be(7)

  - it returns a zero argument function uncurried:
      expect(f(f, 0)).to_be(f)
  - it returns a one argument function uncurried:
      expect(f(f, 1)).to_be(f)
  - it curries a two argument function:
      expect(f(f, 2)).not_to_be(f)
  - it evaluates intermediate arguments one at a time:
      expect(f(math.min, 3)(2)(3)(4)).to_equal(2)
  - it returns a curried function that can be partially applied:
      bin = f(op.pow, 2)(2)
      expect(bin(2)).to_be(op.pow(2, 2))
      expect(bin(10)).to_be(op.pow(2, 10))


- describe default:
  - before:
      f = M.default

  - context with bad arguments:
      badargs.diagnose('std.functional.default(?any, [?any])', f)

  - it returns its first argument:
      expect(f('a', 'b')).to_be 'a'
      expect(f({1}, {2})).to_equal {1}
  - it returns the default for nil:
      expect(f(nil, 'b')).to_be 'b'
  - it keeps false, zero, and an empty string:
      expect(f(false, 'b')).to_be(false)
      expect(f(0, 'b')).to_be(0)
      expect(f('', 'b')).to_be ''
  - it keeps an empty table:
      t = {}
      expect(f(t, 'b')).to_be(t)
  - it keeps a lambda, which is an empty table:
      l = M.lambda '=_1'
      expect(f(l, M.id)).to_be(l)
  - it returns nil without a default:
      expect(f(nil)).to_be(nil)


- describe detect:
  - before:
      f = M.detect

  - context with bad arguments:
      badargs.diagnose('std.functional.detect(table|function, [?any])', f)

  - it works with an empty table:
      expect(f({})).to_be(nil)
  - it finds the first item that passes a predicate function:
      expect(f({1, 2, 3, 4}, function(e) return e > 2 end)).to_be(3)
  - it finds the first item equal to any other value:
      expect(f({'a', 'b', 'a'}, 'b')).to_be 'b'
  - it returns nil if no item passes:
      expect(f({1, 2}, function(e) return e > 2 end)).to_be(nil)
  - it defaults to the first truthy item:
      expect(f(pack(nil, false, 3))).to_be(3)
      expect(f {false, 'x'}).to_be 'x'
      expect(f {false}).to_be(nil)
  - it compares items with an explicit nil:
      expect(f({1, false}, nil)).to_be(nil)
  - it finds false by comparing with it:
      expect(f({1, false, 2}, false)).to_be(false)
  - it calls a functable wrapped by predicate:
      expect(f({1, 2, 3}, M.predicate(M.lambda '=_1 > 1'))).to_be(2)
  - it treats a functable as a value:
      functable = setmetatable({}, {__call = M.nop})
      expect(f({1, functable}, functable)).to_be(functable)
  - it searches the results of an iterator function:
      expect(f(('a b c'):gmatch '%a', 'b')).to_be 'b'
  - it passes all iteration results to the predicate, and returns the first:
      expect(f(M.iter(ipairs {'a', 'b'}), function(i, e) return e == 'b' end)).
         to_be(2)
  - it does not look at items after one that passes:
      n = 0
      f({1, 2, 3}, function(e) n = n + 1 return true end)
      expect(n).to_be(1)


- describe each:
  - before:
      f = M.each

  - context with bad arguments:
      badargs.diagnose('std.functional.each(table|function, callable)', f)
  - it accepts a lambda:
      expect(f({1, 2}, M.lambda '=_1')).to_be(nil)

  - it returns nothing:
      expect(select('#', f({1}, M.id))).to_be(0)
  - it calls a function with every item of a table:
      t = {}
      f({'a', 'b', 'c'}, function(e) t[#t + 1] = e end)
      expect(t).to_equal {'a', 'b', 'c'}
  - it visits every item, whatever the function returns:
      n = 0
      f({1, 2, 3}, function() n = n + 1 return true end)
      expect(n).to_be(3)
  - it keeps holes:
      t = {}
      f(pack('a', nil, 'c'), function(e) t[#t + 1] = e == nil and 'hole' or e end)
      expect(t).to_equal {'a', 'hole', 'c'}
  - it calls a function with all the results of an iteration:
      t = {}
      f(M.iter(pairs {a=1}), function(k, v) t[k] = v end)
      expect(t).to_equal {a=1}
  - it iterates over the results of an iterator function:
      t = {}
      f(('a b'):gmatch '%a', function(e) t[#t + 1] = e end)
      expect(t).to_equal {'a', 'b'}


- describe either:
  - before:
      f = M.either

  - context with bad arguments:
      badargs.diagnose('std.functional.either(?any, [?any])', f)

  - it returns its first argument:
      expect(f('a', 'b')).to_be 'a'
      expect(f({1}, {2})).to_equal {1}
  - it returns the default for nil or an empty table:
      expect(f(nil, 'b')).to_be 'b'
      expect(f({}, 'b')).to_be 'b'
      expect(f(pack(), 'b')).to_be 'b'
  - it keeps false, an empty string and zero:
      expect(f(false, 'b')).to_be(false)
      expect(f('', 'b')).to_be ''
      expect(f(0, 'b')).to_be(0)
  - it returns nil without a default:
      expect(f {}).to_be(nil)


- describe except:
  - before:
      f = M.except

  - context with bad arguments:
      badargs.diagnose('std.functional.except(table, ?any)', f)

  - it copies a table without a key:
      expect(f({a=1, b=2, 'x'}, 'a')).to_equal {b=2, 'x'}
  - it copies a table without the keys that pass a predicate function:
      expect(f({a=1, b=2, c=3}, function(k) return k ~= 'b' end)).to_equal {b=2}
  - it compares keys with any other value:
      expect(f({[1]='x', [2]='y'}, 2)).to_equal {'x'}
  - it treats a functable as a value:
      functable = setmetatable({}, {__call = M.nop})
      expect(f({[functable]=1, a=2}, functable)).to_equal {a=2}
  - it returns a new table, even when nothing is left:
      t = {a=1}
      expect(f(t, 'a')).to_equal {}
      expect(t).to_equal {a=1}
  - it keeps false values:
      expect(f({a=false, b=1}, 'b')).to_equal {a=false}


- describe filter:
  - before:
      elements = {'a', 'b', 'c', 'd', 'e'}
      vowel    = function(e) return e:match '[aeiou]' end
      functable = setmetatable({}, {__call = M.nop})

      f = M.filter

  - context with bad arguments:
      badargs.diagnose('std.functional.filter(table|function, ?any)', f)

  - it works with an empty table:
      expect(f({}, M.id)).to_equal {n=0}
  - it keeps the items that pass a predicate function:
      expect(f(elements, vowel)).to_equal {n=2, 'a', 'e'}
  - it compares items with any value that is not a function:
      expect(f({1, 2, 1, 3}, 1)).to_equal {n=2, 1, 1}
      expect(f({'a', 'b'}, 'b')).to_equal {n=1, 'b'}
  - it compares items with nil:
      expect(f(pack(1, nil, 2), nil)).to_equal {n=1}
  - it treats a functable as a value:
      expect(f({functable, 1, functable}, functable)).
         to_equal {n=2, functable, functable}
      expect(f({functable}, M.lambda '=true')).to_equal {n=0}
  - it calls a functable wrapped by predicate:
      expect(f(elements, M.predicate(M.lambda '=_1:match "[aeiou]"'))).
         to_equal {n=2, 'a', 'e'}
  - it keeps holes in the items:
      expect(f(pack('a', nil, 'c'), function() return true end)).
         to_equal {n=3, 'a', [3]='c'}
  - it filters the results of an iterator function:
      expect(f(('a b c'):gmatch '%a', function(e) return e ~= 'b' end)).
         to_equal {n=2, 'a', 'c'}
  - it passes all iteration results to the predicate:
      expect(f(M.iter(ipairs(elements)), function(i, e)
         return e == 'b' or i == 5
      end)).to_equal {n=2, 2, 5}
  - it does not perturb the argument table:
      f(elements, vowel)
      expect(elements).to_equal {'a', 'b', 'c', 'd', 'e'}


- describe firstof:
  - before:
      f = M.firstof

  - context with bad arguments:
      badargs.diagnose('std.functional.firstof(table|function, [?any], callable)', f)
  - it accepts a lambda:
      expect(f({1, 2, 3}, M.lambda '=_1 > 1 and _1 or nil')).to_be(2)

  - it works with an empty table:
      expect(f({}, M.id)).to_be(nil)
  - it returns the first truthy result of the function:
      expect(f({1, 2, 3}, function(e) if e > 1 then return e * 10 end end)).
         to_be(20)
  - it skips false and nil results by default:
      expect(f({1, 2, 3}, function(e)
         return e == 3 and 'three' or e == 2 and false
      end)).to_be 'three'
  - it returns only the first result of the call:
      expect({f({1, 2}, function(e) return e, 'x' end)}).to_equal {1}
  - it does not call the function for items after one that passes:
