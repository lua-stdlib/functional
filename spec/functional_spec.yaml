# Functional programming for Lua 5.1, 5.2, 5.3, 5.4 & 5.5
# Copyright (C) 2014-2026 std.functional authors

before:
   this_module = 'std.functional.init'
   global_table = '_G'

   exported_apis = {
      'any', 'bind', 'callable', 'case', 'collect', 'compose', 'cond',
      'curry', 'filter', 'flatten', 'foldl', 'foldr', 'id', 'iter',
      'ireverse', 'lambda', 'map', 'map_with', 'memoize', 'nop', 'predicate',
      'product', 'shape', 'zip', 'zip_with',
   }

   M = require(this_module)


specify functional:
- context when required:
  - context by name:
    - it does not touch the global table:
        expect(show_apis {added_to=global_table, by=this_module}).
           to_equal {}
  - it exports the documented apis:
      t = {}
      for k in pairs(M) do t[#t + 1] = k end
      expect(t).to_contain.a_permutation_of(exported_apis)


- describe any:
  - before:
      stop = function() return true end
      fail = function() return false end

      f = M.any

  - context with bad arguments:
      badargs.diagnose('std.functional.any(callable...)', f)
  - it accepts lambdas:
      expect(f(M.lambda '=nil', M.lambda '=_1')(5)).to_be(5)

  - it returns a single function:
      expect(type(f(M.id))).to_be 'function'
  - it propagates arguments and returned results:
      expect(f(M.id)(true)).to_be(true)
      expect({f(M.id)(1, 2, 3)}).to_equal {1, 2, 3}
  - it propagates nil arguments correctly:
      expect(pack(f(M.id)(nil, false, nil, 3))).
         to_equal {n=4, [2]=false, [4]=3}
  - it calls all functions until one returns non-nil:
      expect(f(M.id, M.id, stop, fail)(nil)).to_be(true)
  - it only looks at first returned value:
      expect(f(M.id, M.id, stop, fail)(nil, 'ignored')).to_be(true)
  - it does not call remaining functions after non-nil return:
      expect(f(M.id, fail)(true)).to_be(true)


- describe bind:
  - before:
      op = require 'std.functional.operator'

      f = M.bind

  - context with bad arguments:
      badargs.diagnose('std.functional.bind(callable, table)', f)
  - it accepts a lambda:
      expect(f(M.lambda '=_1 - _2', {10})(3)).to_be(7)

  - it does not affect normal operation if no arguments are bound:
      expect(f(math.min, {})(2, 3, 4)).to_be(2)
  - it takes the extra arguments into account:
      expect(f(math.min, {1, 0})(2, 3, 4)).to_be(0)
  - it appends final call arguments:
      expect(f(math.max, {2, 3})(4, 5, 1)).to_be(5)
  - it does not require all arguments in final call:
      div = function(a, b) return a / b end
      expect(f(div, {100})(25)).to_be(4)
  - it supports out of order extra arguments:
      expect(f(op.pow, {[2] = 3})(2)).to_be(8)
  - it propagates nil arguments correctly:
      r = pack(f(M.id, {[4]='d'})(1))
      expect(r).to_equal(pack(1, nil, nil, 'd'))
      r = pack(f(M.id, {[4]='d'})(nil, 2))
      expect(r).to_equal(pack(nil, 2, nil, 'd'))
      r = pack(f(M.id, {[2]='b', [4]='d'})(nil, 3, 5, 6, nil))
      expect(r).to_equal(pack(nil, 'b', 3, 'd', 5, 6, nil))
      r = pack(f(M.id, {[2]='b', [4]='d'})(nil, 3, nil, nil, 7))
      expect(r).to_equal(pack(nil, 'b', 3, 'd', nil, nil, 7))
      r = pack(f(M.id, {[2]='b', [4]='d'})(nil, 3, nil, nil, 7, nil, nil))
      expect(r).to_equal(pack(nil, 'b', 3, 'd', nil, nil, 7, nil, nil))


- describe callable:
  - before:
      f = M.callable

  - context with bad arguments:
      badargs.diagnose('std.functional.callable([?any])', f)

  - it returns the function associated with a callable:
      for _, v in ipairs {
         true,
         42,
         'str',
         io.stderr,
         {},
         M.nop,
         setmetatable({}, {__call = M.nop}),
      } do
         expect(f(v)).to_be(pcall(v, {}) and M.nop or nil)
      end
  - it returns 'nil' for uncallable arguments:
      expect(f()).to_be(nil)
      expect(f {}).to_be(nil)
      expect(f '').to_be(nil)


- describe case:
  - before:
      yes      = function() return true end
      no       = function() return false end
      default  = function(s) return s end
      branches = {yes=yes, no=no, default}

      f = M.case

  - context with bad arguments: |
      badargs.diagnose('std.functional.case(?any, #table)', f)

  - it matches against branch keys:
      expect(f('yes', branches)).to_be(true)
      expect(f('no',   branches)).to_be(false)
  - it has a default for unmatched keys:
      expect(f('none', branches)).to_be 'none'
  - it returns nil for unmatched keys with no default:
      expect(f('none', {yes=yes, no=no})).to_be(nil)
  - it returns non-function matches:
      expect(f('t', {t=true})).to_be(true)
  - it evaluates returned functions:
      expect(f('fn', {fn = function() return true end})).
         to_be(true)
  - it passes 'with' to function matches:
      expect(f('with', {function(s) return s end})).to_be 'with'
  - it evaluates returned functables:
      functable = setmetatable({}, {__call = function(t, with) return with end})
      expect(f('functable', {functable})).to_be 'functable'
  - it evaluates lambda matches:
      branches = {x=M.lambda '=_1 .. "!"', M.lambda '=_1 .. "?"'}
      expect(f('x', branches)).to_be 'x!'
      expect(f('y', branches)).to_be 'y?'
  - it evaluates 'with' exactly once:
      s = 'prince'
      function acc() s = s .. 's'; return s end
      expect(f(acc(), {
         prince   = function() return 'one' end,
         princes  = function() return 'many' end,
         princess = function() return 'one' end,
                    function() return 'gibberish' end,
      })).to_be 'many'


- describe collect:
  - before:
      f = M.collect

  - context with bad arguments:
      badargs.diagnose('std.functional.collect(table|function)', f)

  - it works with an empty table:
      expect(f {}).to_equal {n=0}
  - it collects the values of a table:
      expect(f {'a', 'b', 'c'}).to_equal {n=3, 'a', 'b', 'c'}
  - it ignores keys outside the sequence:
      expect(f {1, 2, [5]=5, a='b', c='d'}).to_equal {n=2, 1, 2}
  - it takes the length from the n field:
      expect(f {n=3, 'a'}).to_equal {n=3, 'a'}
  - it keeps holes:
      expect(f(pack('a', nil, nil, 'd', 'e'))).
         to_equal {n=5, 'a', [4]='d', [5]='e'}
  - it collects the results of an iterator function:
      expect(f(('a b c'):gmatch '%a')).to_equal {n=3, 'a', 'b', 'c'}
  - it takes the first result of each iteration:
      expect(f(M.iter(ipairs {'x', 'y'}))).to_equal {n=2, 1, 2}
  - it stops at the first nil result:
      expect(f(M.iter(function(_, i)
         if i ~= 3 then return i + 1 end
      end, nil, 0))).to_equal {n=3, 1, 2, 3}


- describe compose:
  - before:
      f = M.compose

  - context with bad arguments:
      badargs.diagnose('std.functional.compose(callable...)', f)
  - it accepts lambdas:
      expect(f(M.lambda '=_1 + 1', M.lambda '=_1 * 2')(3)).to_be(8)

  - it composes a single function correctly:
      expect(f(M.id)(1)).to_be(1)
  - it propagates nil arguments correctly:
      expect(pack(f(M.id)(nil, 2, nil, nil))).
         to_equal(pack(nil, 2, nil, nil))
      expect(pack(f(M.id, M.id)(nil, 2, nil, nil))).
         to_equal(pack(nil, 2, nil, nil))
  - it composes functions in the correct order:
      expect(f(math.sin, math.cos)(1)).
         to_be(math.cos(math.sin(1)))


- describe cond:
  - before:
      yes      = function() return true end
      no       = function() return false end
      default  = function(s) return s end
      branches = {yes=yes, no=no, default}

      f = M.cond

  - it returns nil for no arguments:
      expect(f()).to_be(nil)
  - it evaluates a single function argument:
      expect(f(function() return true end)).to_be(true)
  - it evaluates a single functable argument:
      functable = setmetatable({}, {__call = function() return true end})
      expect(f(functable)).to_be(true)
  - it returns a non-callable single argument directly:
      expect(f 'foo').to_be 'foo'
  - it evaluates a branch function if expr is truthy:
      expect(f('truthy', function(s) return s end)).to_be 'truthy'
  - it returns nil if the last expr is falsey:
      expect(f(nil, function(s) return 'falsey' end)).to_be(nil)
      expect(f(false, true, false, true)).to_be(nil)
  - it recurses with remaining arguments if first argument is falsey:
      expect(f(nil, true, 42, M.id)).to_be(42)
      expect(f(nil, true, false, false, 42, M.id)).to_be(42)
  - it evaluates lambda branches:
      expect(f(M.lambda '=true')).to_be(true)
      expect(f('truthy', M.lambda '=_1 .. "!"')).to_be 'truthy!'


- describe curry:
  - before:
      op = require 'std.functional.operator'

      f = M.curry

  - context with bad arguments:
      badargs.diagnose('std.functional.curry(callable, int)', f)
  - it accepts a lambda:
      expect(f(M.lambda '=_1 - _2', 2)(10)(3)).to_be(7)

  - it returns a zero argument function uncurried:
      expect(f(f, 0)).to_be(f)
  - it returns a one argument function uncurried:
      expect(f(f, 1)).to_be(f)
  - it curries a two argument function:
      expect(f(f, 2)).not_to_be(f)
  - it evaluates intermediate arguments one at a time:
      expect(f(math.min, 3)(2)(3)(4)).to_equal(2)
  - it returns a curried function that can be partially applied:
      bin = f(op.pow, 2)(2)
      expect(bin(2)).to_be(op.pow(2, 2))
      expect(bin(10)).to_be(op.pow(2, 10))


- describe filter:
  - before:
      elements = {'a', 'b', 'c', 'd', 'e'}
      vowel    = function(e) return e:match '[aeiou]' end
      functable = setmetatable({}, {__call = M.nop})

      f = M.filter

  - context with bad arguments:
      badargs.diagnose('std.functional.filter(table|function, ?any)', f)

  - it works with an empty table:
      expect(f({}, M.id)).to_equal {n=0}
  - it keeps the items that pass a predicate function:
      expect(f(elements, vowel)).to_equal {n=2, 'a', 'e'}
  - it compares items with any value that is not a function:
      expect(f({1, 2, 1, 3}, 1)).to_equal {n=2, 1, 1}
      expect(f({'a', 'b'}, 'b')).to_equal {n=1, 'b'}
  - it compares items with nil:
      expect(f(pack(1, nil, 2), nil)).to_equal {n=1}
  - it treats a functable as a value:
      expect(f({functable, 1, functable}, functable)).
         to_equal {n=2, functable, functable}
      expect(f({functable}, M.lambda '=true')).to_equal {n=0}
  - it calls a functable wrapped by predicate:
      expect(f(elements, M.predicate(M.lambda '=_1:match "[aeiou]"'))).
         to_equal {n=2, 'a', 'e'}
  - it keeps holes in the items:
      expect(f(pack('a', nil, 'c'), function() return true end)).
         to_equal {n=3, 'a', [3]='c'}
  - it filters the results of an iterator function:
      expect(f(('a b c'):gmatch '%a', function(e) return e ~= 'b' end)).
         to_equal {n=2, 'a', 'c'}
  - it passes all iteration results to the predicate:
      expect(f(M.iter(ipairs(elements)), function(i, e)
         return e == 'b' or i == 5
      end)).to_equal {n=2, 2, 5}
  - it does not perturb the argument table:
      f(elements, vowel)
      expect(elements).to_equal {'a', 'b', 'c', 'd', 'e'}


- describe flatten:
  - before:
      t = {{{'one'}}, 'two', {{'three'}, 'four'}}

      f = M.flatten

  - context with bad arguments:
      badargs.diagnose('std.functional.flatten(table)', f)

  - it returns a table:
      expect(type(f(t))).to_be 'table'
  - it works for an empty table:
      expect(f {}).to_equal {n=0}
  - it flattens a nested table:
      expect(f(t)).to_equal {n=4, 'one', 'two', 'three', 'four'}


- describe foldl:
  - before:
      op = require 'std.functional.operator'
      f = M.foldl

  - context with bad arguments:
      badargs.diagnose('std.functional.foldl(table|function, [any], callable)', f)
  - it accepts a lambda:
      expect(f({1, 10, 100}, 10000, M.lambda '=_1 + _2')).to_be(10111)

  - it works with an empty table:
      expect(f({}, 10000, op.sum)).to_be(10000)
  - it folds a binary function through a table:
      expect(f({1, 10, 100}, 10000, op.sum)).to_be(10111)
  - it folds from left to right:
      expect(f({3, 4}, 2, op.pow)).to_be((2 ^ 3) ^ 4)
  - it defaults the accumulator to an empty table:
      expect(f({'a', 'b'}, function(acc, e) acc[#acc + 1] = e end)).
         to_equal {'a', 'b'}
  - it keeps the accumulator when the function returns nil:
      expect(f({1, 2, 3}, 0, function(acc, e)
         if e ~= 2 then return acc + e end
      end)).to_be(4)
  - it can accumulate false:
      expect(f({1}, true, M.lambda '=false')).to_be(false)
  - it folds the results of an iterator function:
      expect(f(('a b c'):gmatch '%a', '', M.lambda '=_1 .. _2')).to_be 'abc'
  - it passes all iteration results to the function:
      expect(f(M.iter(ipairs {'a', 'b'}), {}, function(acc, i, e)
         acc[i] = e
      end)).to_equal {'a', 'b'}
  - it visits holes:
      expect(f(pack(1, nil, 3), 0, function(acc, e)
         return acc + (e or 10)
      end)).to_be(14)


- describe foldr:
  - before:
      op = require 'std.functional.operator'
      f = M.foldr

  - context with bad arguments:
      badargs.diagnose('std.functional.foldr(table|function, [any], callable)', f)
  - it accepts a lambda:
      expect(f({10000, 100}, 10, M.lambda '=_1 / _2')).
         to_be(10000 / (100 / 10))

  - it works with an empty table:
      expect(f({}, 1, op.sum)).to_be(1)
  - it folds a binary function through a table:
      expect(f({10000, 100, 10, 1}, 0, op.sum)).to_be(10111)
  - it folds from right to left:
      expect(f({10000, 100}, 10, op.quot)).to_be(10000 / (100 / 10))
  - it defaults the accumulator to an empty table:
      expect(f({'a', 'b'}, function(e, acc) acc[#acc + 1] = e end)).
         to_equal {'b', 'a'}
  - it keeps the accumulator when the function returns nil:
      expect(f({1, 2, 3}, 0, function(e, acc)
         if e ~= 2 then return acc + e end
      end)).to_be(4)
  - it folds the results of an iterator function from the right:
      expect(f(('a b c'):gmatch '%a', '', M.lambda '=_2 .. _1')).to_be 'cba'
  - it visits holes:
      expect(f(pack(1, nil, 3), 0, function(e, acc)
         return acc + (e or 10)
      end)).to_be(14)


- describe id:
  - before:
      f = M.id
  - it returns argument unchanged:
      expect(f(true)).to_be(true)
      expect(f {1, 1, 2, 3}).to_equal {1, 1, 2, 3}
  - it returns multiple arguments unchanged:
      expect({f(1, 'two', false)}).to_equal {1, 'two', false}
  - it propagates nil values correctly:
      expect(pack(f('a', nil, nil, 'd', 'e'))).
         to_equal(pack('a', nil, nil, 'd', 'e'))
      expect(pack(f(nil, nil, 3, 4, nil, nil))).
         to_equal(pack(nil, nil, 3, 4, nil, nil))


- describe ireverse:
  - before: |
      __index = setmetatable({ content = 'a string' }, {
         __index = function(t, n)
            if n <= #t.content then
               return t.content:sub(n, n)
            end
         end,
         __len   = function(t) return #t.content end,
      })

      f = M.ireverse

  - context with bad arguments:
      badargs.diagnose('std.functional.ireverse(table)', f)

  - it returns a new list:
      t = {1, 2, 5}
      expect(f(t)).not_to_be(t)
  - it reverses the elements relative to the original list:
      expect(f {1, 2, 'five'}).to_equal {'five', 2, 1}
  - it ignores the dictionary part of a table:
      expect(f {1, 2, 'five'; a = 'b', c = 'd'}).to_equal {'five', 2, 1}
  - it respects __len metamethod:
      expect(f(__index)).to_equal {'g', 'n', 'i', 'r', 't', 's', ' ', 'a'}
  - it works for an empty list:
      expect(f {}).to_equal {}


- describe lambda:
  - before:
      f = M.lambda

      callable = function(x)
         if M.callable(x) then return true end
         return false
      end

  - context with bad arguments:
      badargs.diagnose('std.functional.lambda(string)', f)

      examples {['it diagnoses bad lambda string'] = function()
         expect(select(2, f 'foo')).to_be "invalid lambda string 'foo'"
      end}
      examples {['it diagnoses an uncompilable expression'] = function()
         expect(select(2, f '||+')).to_be "invalid lambda string '||+'"
         expect(select(2, f '=')).to_be "invalid lambda string '='"
      end}

  - it returns previously compiled lambdas:
      fn = f '|a,b|a==b'
      expect(fn).to_be(f '|a,b|a==b')

  - context with argument format:
    - it returns a callable:
        expect(callable(f '|x| 1+x')).to_be(true)
    - it compiles to a working Lua function:
        fn = f '||42'
        expect(fn()).to_be(42)
    - it propagates argument values:
        fn = f '|...| {...}'
        expect(fn(1,2,3)).to_equal {1,2,3}
    - it can be stringified:
        exp = '|a,b|a==b'
        expect(tostring(f(exp))).to_be(exp)
  - context with expression format:
    - it returns a function:
        expect(callable(f '_')).to_be(true)
    - it compiles to a working Lua function:
        fn = f '=42'
        expect(fn()).to_be(42)
    - it sets auto-argument values:
        fn = f '_*_'
        expect(fn(42)).to_be(1764)
    - it sets numeric auto-argument values:
        fn = f '_1+_2+_3'
        expect(fn(1, 2, 5)).to_be(8)
    - it can be stringified:
        exp = '_%2==0'
        expect(tostring(f(exp))).to_be(exp)
  - it is tagged like a std.prototype object:
      expect(getmetatable(f '_')._type).to_be 'Lambda'


- describe iter:
  - before:
      f = M.iter

  - context with bad arguments:
      badargs.diagnose('std.functional.iter(callable, [?any...])', f)

  - it returns an iterator function:
      expect(type(f(pairs {}))).to_be 'function'
  - it needs no state or control variable:
      next_word = f(('a b'):gmatch '%a')
      expect(next_word()).to_be 'a'
  - it keeps holes in the results of an iteration:
      next_item = f(function(_, c) if not c then return 1, nil, 3 end end)
      expect(pack(next_item())).to_equal {n=3, 1, [3]=3}
  - it passes on all the results of each iteration:
      next_pair = f(pairs {a=1})
      expect({next_pair()}).to_equal {'a', 1}
      expect(next_pair()).to_be(nil)
  - it carries the control variable from call to call:
      next_item = f(ipairs {'x', 'y'})
      expect({next_item()}).to_equal {1, 'x'}
      expect({next_item()}).to_equal {2, 'y'}
      expect(next_item()).to_be(nil)
  - it starts from a given control variable:
      t = {'x', 'y', 'z'}
      fn = ipairs(t)
      next_item = f(fn, t, 1)
      expect({next_item()}).to_equal {2, 'y'}
  - it ignores extra values after the triple:
      t = {'x'}
      fn = ipairs(t)
      next_item = f(fn, t, 0, 'ignored')
      expect({next_item()}).to_equal {1, 'x'}


- describe map:
  - before:
      elements = {'a', 'b', 'c', 'd', 'e'}

      f = M.map

  - context with bad arguments:
      badargs.diagnose('std.functional.map(table|function, callable)', f)
  - it accepts a lambda map function:
      expect(f({'a', 'b'}, M.lambda '=_1 .. "x"')).to_equal {n=2, 'ax', 'bx'}

  - it works with an empty table:
      expect(f({}, M.id)).to_equal {n=0}
  - it maps over the values of a table:
      expect(f(elements, M.id)).to_equal {n=5, 'a', 'b', 'c', 'd', 'e'}
      expect(f(elements, function(e) return e .. 'x' end)).
         to_equal {n=5, 'ax', 'bx', 'cx', 'dx', 'ex'}
  - it keeps holes:
      expect(f(pack('a', nil, nil, 'd', 'e'), M.id)).
         to_equal {n=5, 'a', [4]='d', [5]='e'}
  - it leaves a hole where the function returns nil:
      expect(f({1, 2, 3}, function(e) if e ~= 2 then return e end end)).
         to_equal {n=3, 1, [3]=3}
  - it keeps false results:
      expect(f({1, 2}, M.lambda '=_1 == 2')).to_equal {n=2, false, true}
  - it keeps only the first result of the function:
      expect(f({1, 2}, function(e) return e, 'x' end)).
         to_equal {n=2, 1, 2}
  - it maps over the results of an iterator function:
      expect(f(('a b'):gmatch '%a', function(e) return e .. 'x' end)).
         to_equal {n=2, 'ax', 'bx'}
  - it passes every result of every iteration to the function:
      triples = M.iter(function(_, i)
         if i < 3 then
            return i + 1, nil, 'x'
         end
      end, nil, 0)
      count = function(...) return select('#', ...) end
      expect(f(triples, count)).to_equal {n=3, 3, 3, 3}
  - it does not perturb the argument table:
      f(elements, M.id)
      expect(elements).to_equal {'a', 'b', 'c', 'd', 'e'}


- describe map_with:
  - before:
      t = {{1, 2, 3}, {4, 5}}
      fn = function(...) return select('#', ...) end

      f = M.map_with

  - context with bad arguments:
      badargs.diagnose('std.functional.map_with(table of tables, callable)', f)
  - it accepts a lambda:
      expect(f({{1, 2, 3}, {4, 5}}, M.lambda '=_1 + _2')).to_equal {3, 9}

  - it works for an empty table:
      expect(f({}, fn)).to_equal({})
  - it returns a table:
      u = f(t, fn)
      expect(type(u)).to_be 'table'
  - it creates a new table:
      old = t
      u = f(t, fn)
      expect(t).to_equal(old)
      expect(u).not_to_equal(old)
      expect(t).to_equal {{1, 2, 3}, {4, 5}}
  - it maps a function over a list of argument lists:
      expect(f(t, fn)).to_equal {3, 2}
  - it discards hash-part arguments:
      expect(f({{1,x=2,3}, {4,5,y='z'}}, fn)).to_equal {2, 2}
  - it maps a function over a table of argument lists:
      expect(f({a={1,2,3}, b={4,5}}, fn)).to_equal {a=3, b=2}


- describe memoize:
  - before:
      f = M.memoize

      memfn = f(function(...)
         n = select('#', ...)
         if n == 0 then return nil, 'bzzt' end
         return n, {...}
      end)

  - context with bad arguments:
      badargs.diagnose('std.functional.memoize(callable, [?callable])', f)
  - it accepts a lambda function and mnemonic:
      expect(f(M.lambda '=_1 * 2', M.lambda '=tostring(_1)')(4)).to_be(8)

  - it propagates multiple return values:
      expect((memfn())).to_be(nil)
      expect(select(2, memfn())).to_be 'bzzt'
  - it propogates nil return values:
      expect(pack(f(function(...) return ... end)(nil, nil, 3, 4, nil, nil))).
         to_equal(pack(nil, nil, 3, 4, nil, nil))
  - it propagates multiple arguments:
      expect({memfn('a', 42, false)}).to_equal {3, {'a', 42, false}}
  - it propagates nil arguments:
      n, t = memfn(nil)
      expect(t).to_equal({})
      expect({memfn(nil, 2, nil, nil)}).to_equal {4, {[2]=2}}
  - it returns the same results for the same arguments:
      n, t = memfn(1)
      n, u = memfn(1)
      expect(t).to_be(u)
  - it returns a different object for different arguments:
      n, t = memfn(1)
      n, u = memfn(1, 2)
      expect(t).not_to_be(u)
  - it returns the same object for table valued arguments:
      n, t = memfn {1, 2, 3}
      n, u = memfn {1, 2, 3}
      expect(t).to_be(u)
      n, t = memfn {foo='bar', baz='quux'}
      n, u = memfn {foo='bar', baz='quux'}
      expect(t).to_be(u)
      n, t = memfn {baz='quux', foo='bar'}
      expect(t).to_be(u)
  - it returns a different object for different table arguments:
      n, t = memfn {1, 2, 3}
      n, u = memfn {1, 2}
      expect(t).not_to_be(u)
      n, u = memfn {3, 1, 2}
      expect(t).not_to_be(u)
      n, u = memfn {1, 2, 3, 4}
      expect(t).not_to_be(u)
  - it returns a different object for additional trailing nils:
      n, t = memfn(1, nil)
      n, u = memfn(1)
      expect(t).not_to_be(u)
      n, u = memfn(1, nil, nil)
      expect(t).not_to_be(u)
  - it accepts alternative mnemonic function:
      mnemonic = function(...) return select('#', ...) end
      memfn = f(function(x) return {x} end, mnemonic)
      expect(memfn 'same').to_be(memfn 'not same')
      expect(memfn(1, 2)).to_be(memfn(false, 'x'))
      expect(memfn 'one').not_to_be(memfn('one', 'two'))


- describe nop:
  - before:
      f = M.nop
  - it accepts any number of arguments:
      expect(f()).to_be(nil)
      expect(f(false)).to_be(nil)
      expect(f(1, 2, 3, nil, 'str', {}, f)).to_be(nil)
  - it returns no values:
      expect(f(1, 'two', false)).to_be(nil)


- describe predicate:
  - before:
      f = M.predicate

  - context with bad arguments:
      badargs.diagnose('std.functional.predicate(?any)', f)

  - it returns a plain function as is:
      expect(f(M.id)).to_be(M.id)
  - it unwraps a lambda to the plain function inside it:
      l = M.lambda '|e| e % 2 == 0'
      fn = f(l)
      expect(type(fn)).to_be 'function'
      expect(fn(4)).to_be(true)
      expect(fn(5)).to_be(false)
      expect(f(l)).to_be(fn)
  - it wraps any other functable in a plain function that calls it:
      functable = setmetatable({}, {__call = function(_, ...) return ... end})
      fn = f(functable)
      expect(type(fn)).to_be 'function'
      expect({fn(1, nil, 3)}).to_equal {1, nil, 3}
  - it makes a test for equality with any other value:
      for _, v in ipairs {true, false, 42, 'str', {}} do
         expect(f(v)(v)).to_be(true)
         expect(f(v)(0 == v and 1 or 0)).to_be(false)
      end
  - it tests for nil without arguments:
      expect(f(nil)(nil)).to_be(true)
      expect(f(nil)(false)).to_be(false)
  - it does not look inside tables:
      expect(f({1})({1})).to_be(false)
  - it honours __eq:
      mt = {__eq = function() return true end}
      expect(f(setmetatable({}, mt))(setmetatable({}, mt))).to_be(true)


- describe product:
  - before:
      f = M.product

  - context with bad arguments:
      badargs.diagnose('std.functional.product(list...)', f)

  - it works with an empty table:
      expect(f {}).to_equal {n=0}
  - it returns a list of elements from a single argument:
      expect(f {'a', 'b', 'c'}).to_equal {n=3, {'a'}, {'b'}, {'c'}}
  - it lists combinations with one element from each argument:
      expect(f({1, 2, 3}, {4, 5, 6})).to_equal {
         n=9,
         {1, 4}, {1, 5}, {1, 6},
         {2, 4}, {2, 5}, {2, 6},
         {3, 4}, {3, 5}, {3, 6},
      }
      expect(f({1, 2}, {3, 4}, {5, 6})).to_equal {
         n=8,
         {1, 3, 5}, {1, 3, 6},   {1, 4, 5}, {1, 4, 6},
         {2, 3, 5}, {2, 3, 6},   {2, 4, 5}, {2, 4, 6},
      }
      expect(M.map(f({0,1},{0,1},{0,1}), table.concat)).
         to_equal {n=8, '000', '001', '010', '011', '100', '101', '110', '111'}


- describe shape:
  - before:
      l = {1, 2, 3, 4, 5, 6}

      f = M.shape

  - context with bad arguments:
      badargs.diagnose('std.functional.shape(table, table)', f)

  - it returns a table:
      expect(objtype(f(l, {2, 3}))).to_be 'table'
  - it works for an empty table:
      expect(f({}, {0})).to_equal({})
  - it returns the result in a new table:
      expect(f(l, {2, 3})).not_to_be(l)
  - it does not perturb the argument table:
      f(l, {2, 3})
      expect(l).to_equal {1, 2, 3, 4, 5, 6}
  - it reshapes a table according to given dimensions:
      expect(f(l, {2, 3})).
         to_equal({{1, 2, 3}, {4, 5, 6}})
      expect(f(l, {3, 2})).
         to_equal({{1, 2}, {3, 4}, {5, 6}})
  - it treats 0-valued dimensions as an indefinite number:
      expect(f(l, {2, 0})).
         to_equal({{1, 2, 3}, {4, 5, 6}})
      expect(f(l, {0, 2})).
         to_equal({{1, 2}, {3, 4}, {5, 6}})


- describe zip:
  - before:
      tt = {{1, 2}, {3, 4}, {5, 6}}

      f = M.zip

  - context with bad arguments:
      badargs.diagnose('std.functional.zip(table of tables)', f)

  - it works for an empty table:
      expect(f {}).to_equal {}
  - it is the inverse of itself:
      expect(f(f(tt))).to_equal(tt)
  - it transposes rows and columns:
      expect(f(tt)).to_equal {{1, 3, 5}, {2, 4, 6}}
      expect(f {x={a=1, b=2}, y={a=3, b=4}, z={b=5}}).
         to_equal {a={x=1, y=3}, b={x=2,y=4,z=5}}


- describe zip_with:
  - before:
      tt = {{1, 2}, {3, 4}, {5}}
      fn = function(...) return tonumber(table.concat {...}) end

      f = M.zip_with

  - context with bad arguments:
      badargs.diagnose('std.functional.zip_with(table of tables, callable)', f)
  - it accepts a lambda:
      expect(f({{1, 2}, {3, 4}}, M.lambda '=_1 + _2')).to_equal {4, 6}

  - it works for an empty table:
      expect(f({}, fn)).to_equal {}
  - it returns a table:
      expect(type(f(tt, fn))).to_be 'table'
  - it returns the result in a new table:
      expect(f(tt, fn)).not_to_be(tt)
  - it does not perturb the argument list:
      m = f(tt, fn)
      expect(tt).to_equal {{1, 2}, {3, 4}, {5}}
  - it combines column entries with a function:
      expect(f(tt, fn)).to_equal {135, 24}
  - it discards hash-part arguments:
      expect(f({{1,2}, x={3,4}, {[2]=5}}, fn)).to_equal {1, 25}
  - it combines matching key entries with a function:
      expect(f({{a=1,b=2}, {a=3,b=4}, {b=5}}, fn)).
         to_equal {a=13, b=245}
